<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Код входа в SimpleSchedule</title>
  </head>
  <body style="margin:0;padding:24px;background-color:#f4f5fa;color:#202230;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.6;">
    <main style="max-width:480px;margin:0 auto;padding:28px;background-color:#ffffff;border:1px solid #dedfeb;border-radius:16px;">
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Вход в SimpleSchedule</h1>
      <p style="margin:0 0 16px;">Введите этот одноразовый код в приложении:</p>
      <p aria-label="Одноразовый код" style="margin:0 0 20px;padding:16px;background-color:#f0edff;color:#392787;font-family:ui-monospace,'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;">{{ .Token }}</p>
      <p style="margin:0 0 16px;">Код действует 10 минут. Никому его не сообщайте.</p>
      <p style="margin:0;color:#535766;font-size:14px;">Если вы не запрашивали вход, просто проигнорируйте это письмо.</p>
    </main>
  </body>
</html>
